name: Sincronizar catálogo de Wallapop

on:
  schedule:
    # 08:00 y 20:00 hora de Madrid (en verano). GitHub usa UTC.
    - cron: "0 6,18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pedir el catálogo a Grok
        id: grok
        continue-on-error: true
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          mkdir -p debug
          set -o pipefail
          python scripts/sync_grok.py 2>&1 | tee debug/grok.log
      - name: Publicar catálogo
        if: steps.grok.outcome == 'success'
        run: |
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          if git diff --quiet products.json; then
            echo "Sin cambios en el catálogo"
          else
            git add products.json
            git commit -m "Actualizar catálogo"
            git push
          fi
      - name: Guardar diagnóstico en la rama debug
        if: always()
        run: |
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          mkdir -p debug && cp -r debug /tmp/debug-out
          git checkout --orphan debug-tmp
          git rm -rq --cached . || true
          rm -rf ./* .github .gitignore 2>/dev/null || true
          cp -r /tmp/debug-out/. ./
          echo "Ejecución: ${{ github.run_id }} · Grok: ${{ steps.grok.outcome }}" > RESUMEN.txt
          git add -A
          git commit -qm "Diagnóstico ejecución ${{ github.run_id }}"
          git push -f origin debug-tmp:debug
      - name: Marcar fallo si no se actualizó
        if: steps.grok.outcome != 'success'
        run: exit 1
